{% extends 'base.html' %}

{% block title %}Cadastro de Produto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <h2 class="mb-4">Cadastro de produto</h2>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors|join:', ' }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Salvar produto</button>
                    <a class="btn btn-outline-secondary" href="{% url 'produtos:lista_produtos' %}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
