databases:
  - name: controle-vendas-db
    databaseName: controle_vendas
    user: controle_vendas
    plan: free

services:
  - type: web
    name: controle-vendas-estoque
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: DATABASE_URL
        fromDatabase:
          name: controle-vendas-db
          property: connectionString